    <link rel="stylesheet" href="./public/style.css" />

  <body>
    <!-- div dengan id="root" akan menjadi tempat untuk merender komponen React. Semisal
    tidak tertampil di browser, maka kemungkinan ada kesalahan pada kode React yang menyebabkan error sehingga tidak bisa dirender dan muncul tulisan "not rendered".
    Cek console browser untuk melihat errornya. -->
    <div
      id="modal"
      class="fixed inset-0 z-10 flex items-center justify-center bg-black/90 empty:hidden"
    ></div>
    <div id="root">not rendered</div>
    <!-- Content Delivery Network untuk React dan ReactDOM (Document Object Model). Pastikan versi yang digunakan 
    sesuai dengan versi React yang digunakan dalam proyek. Jika menggunakan versi yang
    berbeda, pastikan untuk menyesuaikan URL CDN. -->
    <!-- <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script> -->
    <script type="module" src="./src/App.tsx"></script>
  </body>
</html>
